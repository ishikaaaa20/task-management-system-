{% extends "base.html" %}
{% block title %} Tasks {% endblock %}
{% block content %}
<div class="task-box">
    <h2>Your Tasks</h2>
    <form method="POST" action="{{url_for('task.add_task')}}" class="task-form">
        <input type="text" name="title" placeholder="Add a new task..." required>
        <button class="btn" type="submit">Add Task</button>
    </form>
    {% if tasks %}
    <form method="POST" action="{{url_for('task.clear_tasks')}}">
        <button class="btn-delete" type="submit">Clear Tasks</button>
    </form>
    <br>
    <table class="task-table">
        <thead>
            <tr>
                <th>Task</th>
                <th>Status</th>
                <th>Change</th>
            </tr>
        </thead>
        <tbody>
            {% for task in tasks %}
            <tr>
                <td>{{ task.title }}</td>
                <td>
                    <span class="badge {{ task.status|lower }}">{{ task.status }}</span>
                </td>
                <td>
                    <form method="POST" action="{{ url_for('task.toggle_status', task_id=task.id) }}">
                        <button class="btn" type="submit">Toggle Status</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p>No tasks available. add one above!!</p>  
    {% endif %} 
</div>

{% endblock %}
